services:
  birmarket:
    build:
      context: .
      dockerfile: Dockerfile
    image: birmarket:local
    env_file:
      - ./birmarket.env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      - "8080:8080"
    volumes:
      - ./.data:/app/.data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/api/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
