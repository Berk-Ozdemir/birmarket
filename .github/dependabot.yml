version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend/birmarket-web
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      angular-and-tooling:
        patterns:
          - "@angular/*"
          - "*"
  - package-ecosystem: nuget
    directory: /backend/Birmarket.Api
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
  - package-ecosystem: nuget
    directory: /tests/Birmarket.Tests
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      github-actions:
        patterns:
          - "*"
