name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Restore local tools and packages
        run: |
          dotnet tool restore
          dotnet restore Birmarket.sln
      - name: Verify C# formatting
        run: dotnet format Birmarket.sln --verify-no-changes --no-restore
      - name: Run API integration tests
        run: dotnet test Birmarket.sln --configuration Release --no-restore

  frontend-checks:
    name: Frontend build, tests, and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/birmarket-web
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/birmarket-web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Verify source formatting
        run: npm run format:check
      - name: Build production application
        run: npm run build
      - name: Run Angular unit tests
        run: npm test

  browser-tests:
    name: Playwright storefront scenarios
    runs-on: ubuntu-latest
    env:
      birmarket_demo_mode: "true"
      CI: "true"
    defaults:
      run:
        working-directory: frontend/birmarket-web
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/birmarket-web/package-lock.json
      - name: Install Playwright browser
        run: |
          npm ci
          npx playwright install chromium
      - name: Run browser tests
        run: npm run e2e

  container-build:
    name: Validate production container
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build container image
        run: docker build --tag birmarket:ci .
